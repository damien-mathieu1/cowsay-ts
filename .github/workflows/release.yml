name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Compute CalVer tag
        id: version
        run: |
          PREFIX="v$(date +%Y.%-m)"
          COUNT=$(git tag -l "${PREFIX}.*" | wc -l | tr -d ' ')
          TAG="${PREFIX}.$((COUNT + 1))"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set package.json version
        run: npm version --no-git-tag-version "${TAG#v}"
        env:
          TAG: ${{ steps.version.outputs.tag }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --tag ${{ steps.version.outputs.tag }} --unreleased --prepend CHANGELOG.md
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit version + changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin main --follow-tags

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
